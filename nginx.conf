server {
    # استفاده از پورت داینامیک که توسط اسکریپت جایگذاری می‌شود
    listen __PORT__;
    
    # ریدایرکت کردن آدرس اصلی دامنه به مسیر مخفی پنل
    location = / {
        return 301 /__SECRET_PATH__;
    }
    
    # انتقال تمامی ترافیک پنل، فایل‌ها و APIها به سرویس بک‌پک
    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # پشتیبانی از WebSocket برای نمایش زنده مصرف منابع در داشبورد
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}