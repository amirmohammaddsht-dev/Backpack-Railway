server {
    # استفاده از پورت داینامیک Railway
    listen __PORT__;
    
    # ۱. ریدایرکت کردن آدرس اصلی دامنه به مسیر مخفی
    location = / {
        return 301 /__SECRET_PATH__;
    }
    
    # ۲. انتقال تمامی ترافیک پنل، فایل‌ها و APIها به بک‌پک
    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # ۳. پشتیبانی از WebSocket برای نمایش زنده منابع در داشبورد
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}