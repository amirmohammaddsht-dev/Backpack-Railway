app = "ctunnel-railway"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# سرویس اول: تانل وب‌سوکت (Chisel)
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

# سرویس دوم: دسترسی به پنل سنایی
[[services]]
  internal_port = 2053
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 2053
