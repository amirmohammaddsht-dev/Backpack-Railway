# fly.toml app configuration file generated for backpack-railway on 2026-11-18T23:03:28Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'backpack-railway'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '15s'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'xui_data'
  destination = '/etc/x-ui'
  initial_size = '1gb'

[http_service]
  internal_port = 2053
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[restart]]
  policy = 'always'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
