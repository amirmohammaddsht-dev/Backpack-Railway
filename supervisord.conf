[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:x-ui]
# استفاده از اسکریپت start برای اجرای صحیح و دور زدن منوی تعاملی
command=bash -c 'if [ -f /usr/local/x-ui/x-ui ]; then cd /usr/local/x-ui && ./x-ui; elif [ -f /opt/x-ui/x-ui ]; then cd /opt/x-ui && ./x-ui; else x-ui start; sleep infinity; fi'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backpack]
command=bash -c 'if [ -f /opt/backpack/tunnel_link.txt ]; then LINK=$(cat /opt/backpack/tunnel_link.txt); backpack "$LINK"; else echo "Waiting for TUNNEL_LINK..."; sleep infinity; fi'
directory=/opt/backpack
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
