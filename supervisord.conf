[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# این بلوک اضافه شد تا کانفیگ تونل‌ها خوانده شود
[include]
files = /etc/supervisor/custom.d/*.conf

[program:x-ui]
command=/app/x-ui
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# One-shot: builds the tunnel from $TUNNEL_LINK and exits. The tunnel then runs as its
# own program (backpack-<name>), written to custom.d by fake_systemctl.sh.
[program:tunnel-setup]
command=/usr/local/bin/apply-link.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0