[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:x-ui]
command=/usr/local/x-ui/x-ui
directory=/usr/local/x-ui
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backpack]
# اجرای بک‌پک با دستور ساخته‌شده
command=bash -c 'if [ -f /opt/backpack/tunnel_link.txt ]; then LINK=$(cat /opt/backpack/tunnel_link.txt); backpack "$LINK"; else echo "Waiting for TUNNEL_LINK..."; sleep infinity; fi'
directory=/opt/backpack
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
