[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# Tunnel programs (backpack-<name>.conf) are written here by fake_systemctl.sh
[include]
files = /etc/supervisor/custom.d/*.conf

[program:x-ui]
command=/app/x-ui
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# BackPack web panel. Its address, password and port come from panel-config.sh
# (PANEL_PATH / PANEL_PASSWORD / PANEL_PORT), which runs before supervisord starts.
# Logs go to a small file because the panel's own Logs page reads them through journalctl.
[program:backpack-webui]
command=/usr/local/bin/backpack --webui
autostart=true
autorestart=true
startretries=1000000
redirect_stderr=true
stdout_logfile=/var/log/backpack-webui.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0

# Watchdog, alerts and Telegram bot. It restarts tunnels that drop; the panel's health
# page reports "no watchdog" while it is not running.
[program:backpack-monitor]
command=/usr/local/bin/backpack --monitor
autostart=true
autorestart=true
startretries=1000000
redirect_stderr=true
stdout_logfile=/var/log/backpack-monitor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0

# One-shot: builds the tunnel from $TUNNEL_LINK and exits. The tunnel then runs as its
# own program (backpack-<name>), written to custom.d by fake_systemctl.sh.
[program:tunnel-setup]
command=/usr/local/bin/apply-link.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0